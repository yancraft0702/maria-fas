# ============================================================================
# TURN (coturn) - configuracao de referencia do projeto MARIA FAS
# ============================================================================
#
# Este arquivo NAO e suficiente sozinho: e preciso o BINARIO do coturn
# rodando. O que falta nesta maquina esta documentado em `docs/TURN.md`.
#
# Como usar (Linux/macOS/WSL ou container):
#
#   1) Gere um segredo forte:
#        openssl rand -hex 32
#   2) Copie `infra/coturn/.env.exemplo` para o seu `.env` (raiz do projeto)
#      e preencha TURN_SECRET com o valor gerado.
#   3) Suba o coturn com este arquivo:
#        turnserver -c infra/coturn/turnserver.conf -v
#   4) Abra as portas no firewall (ver `firewall` abaixo).
#   5) Prove que existe relay de verdade:
#        npm run test:turn
#
# A alternativa em container (imagens oficiais, sem compilar):
#
#   docker run -d --name coturn \
#     -p 3478:3478/tcp -p 3478:3478/udp -p 5349:5349/tcp \
#     -v "$PWD/infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro" \
#     coturn/coturn -c /etc/coturn/turnserver.conf
#
# ----------------------------------------------------------------------------
# Porta e transporte
# ----------------------------------------------------------------------------
listening-port=3478
# TLS na 5349 e o que passa em rede corporativa que bloqueia UDP.
listening-port=5349

# Sem isto o coturn NAO ouve UDP (o modo mais comum de relay).
no-udp=0
no-tcp=0
no-tls=0
no-dtls=0

# O relay UDP do coturn e o caminho mais usado por transmissao de video.
# bandwidth e o teto por sessao relay.
# relay-ip e o IP PUBLICO desta maquina (a rede externa). Descobrir com:
#   curl -s https://api.ipify.org
relay-ip=<IP_PUBLICO_DA_MAQUINA>

# `listening-ip` deve ser o IP LOCAL desta maquina. Sem ele o coturn tenta
# adivinhar e, com varias interfaces (VPN, Docker, Hyper-V), escolhe a errada
# e o relay nao sobe.
listening-ip=0.0.0.0

# ----------------------------------------------------------------------------
# Credenciais (item 3: segredo NUNCA vai para o navegador)
# ----------------------------------------------------------------------------
# `use-auth-secret` liga o modo TURN REST API: o servidor confere a credencial
# recalculando HMAC-SHA1( static-auth-secret , username ). O frontend recebe
# apenas `username = <expiracao>:<rotulo>` e `credential = base64(HMAC)`, que
# expira em minutos (TURN_TTL_SECONDS). Troque o segredo abaixo pelo valor
# gerado - o valor de exemplo aqui e INVALIDO de proposito.
use-auth-secret
static-auth-secret=TROQUE_PELO_SEGREDO_GERADO_COM_OPENSSL_RAND_HEX_32

# TTL maximo que o coturn aceita numa credencial efemera. Acima disso ele
# recusa a credencial, mesmo que o HMAC esteja certo.
max-credential-ttl=7200

# `realm` aparece nos logs do coturn. Put-lo com o dominio real do servico.
realm=turn.exemplo.invalid

# Se o coturn so vai ser usado por este projeto, tudo bem deixar anonimo
# desativado: sem usuario/senha o relay e proibido.
no-anonymous=1

# ----------------------------------------------------------------------------
# Log e limites
# ----------------------------------------------------------------------------
# Log detalhadissimo ajuda a provar (ou negar) um relay real.
verbose
log-file=/var/log/coturn/turnserver.log
simple-log

# Limite de bytes por sessao relay. Uma transmissao de video1080p precisa de
# folga; 2 Gbps cobre LIVE com varios espectadores sendo relay.
max-bitrate=2000000000

# Numero maximo de alocacoes relay por IP de cliente.
max-allocate-lifetime=600
# Quantas conexoes simultaneas o servidor aceita no total.
total-quota=1200
user-quota=12

# Nao responder a requisicoes de alocacao vindas de redes privadas/localhost
# (evita o TURN se usar como relay aberto para a rede interna).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# ----------------------------------------------------------------------------
# Firewall (linhas de exemplo)
# ----------------------------------------------------------------------------
#   Windows (PowerShell como administrador):
#     New-NetFirewallRule -DisplayName "TURN UDP 3478" -Direction Inbound `
#       -Protocol UDP -LocalPort 3478 -Action Allow
#     New-NetFirewallRule -DisplayName "TURN TCP 3478" -Direction Inbound `
#       -Protocol TCP -LocalPort 3478 -Action Allow
#     New-NetFirewallRule -DisplayName "TURNS 5349" -Direction Inbound `
#       -Protocol TCP -LocalPort 5349 -Action Allow
#
#   Linux (ufw):
#     ufw allow 3478/udp && ufw allow 3478/tcp && ufw allow 5349/tcp